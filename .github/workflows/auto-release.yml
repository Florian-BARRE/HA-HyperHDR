name: Auto release

# A version in manifest.json without a matching release means one is due:
# check, then create the release with the changelog entry and attach
# ha_hyperhdr.zip, which HACS installs. A version with a pre-release part
# (0.2.0b1, 0.2.0rc1) is published as a pre-release: HACS shows it only with
# "Show beta versions" on.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find the version to release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python3 -c "import json; print(json.load(open('custom_components/ha_hyperhdr/manifest.json'))['version'])")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          if [[ "${version}" =~ (a|b|rc)[0-9]+$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          if gh release view "v${version}" > /dev/null 2>&1; then
            echo "v${version} is already released."
            echo "due=false" >> "$GITHUB_OUTPUT"
          else
            echo "due=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@v6
        if: steps.version.outputs.due == 'true'
      - name: Check
        if: steps.version.outputs.due == 'true'
        run: |
          uv venv -p 3.14 .venv
          uv pip install -p .venv -r requirements_test.txt
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
          .venv/bin/pytest -q
      - name: Release notes from the changelog
        if: steps.version.outputs.due == 'true'
        run: |
          version="${{ steps.version.outputs.version }}"
          awk -v version="${version}" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no entry for ${version}" >&2
            exit 1
          fi
      - name: Build the archive HACS installs
        if: steps.version.outputs.due == 'true'
        run: cd custom_components/ha_hyperhdr && zip -qr "$GITHUB_WORKSPACE/ha_hyperhdr.zip" . -x '__pycache__/*'
      - name: Create the release
        if: steps.version.outputs.due == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then flags+=(--prerelease); fi
          gh release create "${{ steps.version.outputs.tag }}" ha_hyperhdr.zip \
            --target "${GITHUB_SHA}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file notes.md \
            "${flags[@]}"
